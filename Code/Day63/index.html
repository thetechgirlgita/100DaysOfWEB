<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamro Cinema | Valentine Multiplex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lobby" class="container">
        <h1 class="logo">Hamro Cinema <span>Multiplex</span></h1>
        <div class="movie-list">
            <div class="card" onclick="openTheater('Screen 1', 'INTERSTELLAR', 15)">
                <div class="promo-tag">Valentine's Special</div>
                <h3>INTERSTELLAR</h3>
                <p>19:30 | Screen 1</p>
            </div>
            <div class="card" onclick="openTheater('Screen 2', 'THE BATMAN', 12)">
                <div class="promo-tag">Valentine's Special</div>
                <h3>THE BATMAN</h3>
                <p>21:00 | Screen 2</p>
            </div>
        </div>
    </div>

    <div id="theater" class="container hidden">
        <div id="errorCard" class="error-card hidden">
            <div class="error-icon">💔</div>
            <div class="error-text">
                <strong>Sorry, Pal!</strong><br>
                This discount is for couples only. Go get a partner first!
            </div>
        </div>

        <button onclick="goBack()" class="back-btn">← Back to Lobby</button>
        <h2 id="activeMovie"></h2>
        
        <div class="screen-bar">SCREEN</div>
        
        <div id="seatGrid" class="grid"></div>

        <ul class="legend">
            <li><div class="seat"></div> Available</li>
            <li><div class="seat selected"></div> Selected</li>
            <li><div class="seat occupied"></div> Sold Out</li>
        </ul>

        <div class="promo-container">
            <label class="promo-toggle">
                <input type="checkbox" id="coupleToggle" onchange="handleToggleClick()">
                <span class="checkmark"></span>
                Apply Couple's Discount? 💖
            </label>
            <p class="promo-detail">(Buy 2+ seats for 20% OFF + Free Popcorn)</p>
        </div>

        <button class="confirm-btn" onclick="issueReceipt()">
            Confirm Selection ($<span id="total">0</span>)
        </button>
    </div>

    <div id="receiptModal" class="modal hidden">
        <div class="modal-content" id="modalContainer">
            <div id="receiptBody"></div>
            <button onclick="closeReceipt()" class="close-btn">Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
