<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arijit Singh | Day 46 Tribute</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="player-wrapper" 
         onmouseenter="document.getElementById('audio').play()" 
         onmouseleave="document.getElementById('audio').pause()">
        
        <div class="cd-disc">
            <div class="iridescent-layer"></div>
            <div class="cd-center">
                <div class="hole"></div>
            </div>
            <div class="disc-label">ARIJIT SINGH</div>
        </div>

        <div class="glass-sleeve">
            <div class="artist-image">
                <img src="https://w0.peakpx.com/wallpaper/216/433/HD-wallpaper-arijit-singh-biography-songs-marriage-family-awards-achievements.jpg" alt="Arijit Singh">
            </div>
            
            <div class="glass-content">
                <div class="info">
                    <span class="category">Legacy Edition (2011-2026)</span>
                    <h1>Arijit Singh</h1>
                    <p>Melody for the Code</p>
                </div>
                <div class="status-bar">
                    <span class="playing-text">HOVER TO EJECT & PLAY</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio" src="judaai.mp3" loop></audio>

</body>
</html>
