<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="radio" name="color" id="color-1" checked>
        <input type="radio" name="color" id="color-2">
        <input type="radio" name="color" id="color-3">

        <div class="card">
            <div class="glass-layer"></div>
            <div class="content">
                <span class="brand">PRO SERIES</span>
                <h2>Wireless Headphones</h2>
                
                <div class="img-container">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Headphones">
                </div>

                <div class="controls">
                    <label for="color-1" class="btn-1"></label>
                    <label for="color-2" class="btn-2"></label>
                    <label for="color-3" class="btn-3"></label>
                </div>
                
                <button class="buy-btn">Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
