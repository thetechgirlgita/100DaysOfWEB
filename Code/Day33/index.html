<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 33 - Suraj Fast Food Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="receipt">
        <header>
            <h1>SURAJ FAST FOOD</h1>
            <p>Order #7892 | 14 Jan 2026</p>
        </header>

        <div class="divider"></div>

        <section class="order-details">
            <div class="line-item">
                <span>1x Veg Burger</span>
                <span>₹60</span>
            </div>
            <div class="line-item">
                <span>2x Veg Manchurian (G)</span>
                <span>₹280</span>
            </div>
            <div class="line-item">
                <span>1x Chilly Paneer</span>
                <span>₹180</span>
            </div>
        </section>

        <div class="divider"></div>

        <section class="totals">
            <div class="line-item">
                <span>Subtotal</span>
                <span>₹520</span>
            </div>
            <div class="line-item">
                <span>GST (5%)</span>
                <span>₹26</span>
            </div>
            <div class="total-amount">
                <span>TOTAL</span>
                <span>₹546</span>
            </div>
        </section>

        <footer class="receipt-footer">
            <p>Paid via UPI</p>
            <div class="barcode">|||| | || ||| | |||</div>
            <p>Thank You! Come Again.</p>
        </footer>
    </div>

</body>
</html>
