<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-card">
        <div class="tabs">
            <button id="loginTab" class="active" onclick="showTab('login')">Login</button>
            <button id="signupTab" onclick="showTab('signup')">Sign Up</button>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <h2>Welcome Back</h2>
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="main-btn">Login</button>
            <p id="loginMsg" class="message"></p>
        </form>

        <form id="signupForm" class="hidden" onsubmit="event.preventDefault(); handleSignup();">
            <h2>Create Account</h2>
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email Address" required>
            <input type="password" id="signupPass" placeholder="Create Password" required>
            <button type="submit" class="main-btn">Register</button>
            <p id="signupMsg" class="message"></p>
        </form>

        <div id="welcomeState" class="hidden">
            <h2>Hello, <span id="userName"></span>!</h2>
            <p>You are now securely logged in.</p>
            <button onclick="logout()" class="logout-btn">Sign Out</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
