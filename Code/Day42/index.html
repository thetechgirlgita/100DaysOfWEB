<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 42 - 3D Flip Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="flip-card">
            
            <div class="card-front">
                <div class="chip"></div>
                <div class="logo">CHALLENEGE MEMBERSHIP</div>
                <div class="number">**** **** **** 2026</div>
                <div class="details">
                    <span>DAY 42 / 100</span>
                    <span>100DaysOfWEB</span>
                </div>
            </div>

            <div class="card-back">
                <div class="magnetic-strip"></div>
                <div class="signature-area">
                    <p>888</p>
                </div>
                <div class="back-text">
                    This card remains property of the #100DaysOfWEB challenge. Valid only for passionate developers.
                </div>
            </div>

        </div>
    </div>

</body>
</html>
