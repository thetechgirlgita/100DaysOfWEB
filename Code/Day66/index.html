<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 66 | Task Scheduler & Alarms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-app">
        <header>
            <h2>Task Scheduler</h2>
            <p id="dateDisplay"></p>
        </header>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <div class="row">
                <input type="datetime-local" id="timeInput">
                <button onclick="addTask()" class="add-btn">Schedule</button>
            </div>
        </div>

        <ul id="taskList"></ul>

        <div class="footer">
            <span id="taskCount">0 active</span>
            <button class="clear-btn" onclick="clearCompleted()">Clear Finished</button>
        </div>
    </div>

    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
