<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 65 | Modern To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-app">
        <header>
            <h2>My Tasks</h2>
            <p id="dateDisplay"></p>
        </header>
        
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Add a new goal...">
            <button onclick="addTask()" class="add-btn">Add</button>
        </div>

        <ul id="taskList">
            </ul>

        <div class="footer">
            <span id="taskCount">0 tasks left</span>
            <button class="clear-btn" onclick="clearCompleted()">Clear Finished</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
