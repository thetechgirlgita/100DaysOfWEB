<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 54 | Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h2>Number Guessing Game</h2>
        <p>Pick a number between 1 - 100</p>
        
        <input type="number" id="guessInput" placeholder="??">
        <button id="submitBtn">Guess</button>
        
        <p id="message">Good Luck!</p>
        <p class="attempts">Attempts: <span id="attemptsCount">0</span></p>
        <button id="resetBtn" style="display:none;">Play Again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
