<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 43 - 3D Origami Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-card">
        <div class="fold fold-top">
            <div class="label">TODAY'S SPECIAL</div>
            <h2>Crispy Paneer 65</h2>
            <div class="hint">Hover to Unfold ↓</div>
        </div>

        <div class="fold fold-middle">
            <img src="https://www.cookwithmanali.com/wp-content/uploads/2016/01/Chilli-Paneer-Restaurant-Style.jpg" alt="Paneer 65">
        </div>

        <div class="fold fold-bottom">
            <div class="details">
                <p>Spicy, deep-fried paneer cubes tossed with curry leaves and southern spices.</p>
                <div class="price-row">
                    <span class="price">₹280</span>
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
