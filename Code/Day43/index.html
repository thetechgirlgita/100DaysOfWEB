<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 43 - 3D Unfolding Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="unfold-wrapper">
        <div class="fold fold-top">
            <h2>The Menu</h2>
            <p>Hover to Unfold</p>
        </div>

        <div class="fold fold-middle">
            <div class="content">
                <h3>Main Course</h3>
                <ul>
                    <li>3D CSS Pasta</li>
                    <li>Glassmorphic Risotto</li>
                </ul>
            </div>
        </div>

        <div class="fold fold-bottom">
            <div class="content">
                <h3>Desserts</h3>
                <p>Neon Orange Soufflé</p>
                <button class="order-btn">Order Now</button>
            </div>
        </div>
    </div>

</body>
</html>
